<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Battlecard Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
      padding-top: 100px;
    }
    .card {
      max-width: 500px;
      margin: auto;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
    }
  </style>
</head>
<body>
   <div class="bg-dark text-white p-2 mb-4 text-end">
    {% if request.cookies.get("username") %}
      Logged in as <strong>{{ request.cookies.get("username") }}</strong> |
      <a href="/logout" class="text-white">Logout</a>
    {% else %}
      <a href="/login" class="text-white">Login</a> |
      <a href="/signup" class="text-white">Sign Up</a>
    {% endif %}
  </div>
  <div class="card">
    <h2 class="text-center mb-4">AI Battlecard Generator</h2>
    <form method="get" action="/search">
      <div class="mb-3">
        <label for="query" class="form-label">Competitor Name:</label>
        <input type="text" class="form-control" id="query" name="query" placeholder="e.g. OpenAI" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Generate Battlecard</button>
    </form>
  </div>
</body>
</html>
