<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Generate Battlecard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: radial-gradient(circle at center, #333 0%, #000 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 500px;
    }

    label {
      color: #fff;
    }

    .btn-primary {
      background-color: #00bfff;
      border: none;
    }

    .btn-primary:hover {
      background-color: #009acd;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="text-center mb-4">Generate a Battlecard</h2>
    <form method="get" action="/search">
      <div class="mb-3">
        <label for="query" class="form-label">Competitor Name</label>
        <input type="text" class="form-control" id="query" name="query" required placeholder="e.g. Google">
      </div>
      <button type="submit" class="btn btn-primary w-100">Generate</button>
    </form>
  </div>
</body>
</html>
